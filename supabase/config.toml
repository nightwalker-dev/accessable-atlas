# Supabase Local Development Configuration — AccessAble Atlas
project_id = "accessable-atlas"

[api]
enabled = true
port = 54321
schemas = ["public", "storage"]
extra_search_path = ["public", "extensions"]
max_rows = 200

[db]
port = 54322
major_version = 16

[auth]
enabled = true
site_url = "http://127.0.0.1:8080"
additional_redirect_urls = ["http://127.0.0.1:8080"]
jwt_expiry = 3600
enable_signup = true

[storage]
enabled = true
file_size_limit = "5MiB"

